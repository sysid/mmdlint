name: Publish

# Manual only: publishing to npm is irreversible, so a human picks the moment and the ref (a v<version> tag).
on:
  workflow_dispatch:

permissions:
  contents: read
  # npm trusted publishing: the job's OIDC token replaces a long-lived NPM_TOKEN and adds provenance.
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require a v<version> tag matching VERSION and package.json
        # Publishing from a branch would ship whatever is on it under a version number that may already be tagged.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$version" ] || [ "$package_version" != "$version" ]; then
            echo "::error::Run from tag v$version. Got $REF_TYPE '$REF_NAME', VERSION $version, package.json $package_version."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 bundles. No registry-url: npmjs is the default,
          # and OIDC needs no .npmrc token entry.
          node-version: 24
      - run: npm ci
      - run: make all
      # Not `make publish`: its `npm whoami` login check fails under OIDC, where there is no token to log in with.
      - run: npm publish --access public
